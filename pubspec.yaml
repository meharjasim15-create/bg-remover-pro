[4:45 am, 01/07/2026] Jn9: workflows:
  android-workflow:
    name: BG Remover Pro - Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Unzip project files
        script: |
          unzip -o *.zip -d .
      - name: Get Flutter packages
        script: |
          cd bg_remover_app && flutter pub get
      - name: Build APK
        script: |
          cd bg_remover_app && flutter build apk --release
    artifacts:
      - bg_remover_app/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
